<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinister Sicks | Recruitment Scouter</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0d0d0f;
      color: #e5e5e5;
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 {
      color: #dc2626;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 1.4rem;
      margin-bottom: 4px;
      border-bottom: 2px solid #7f1d1d;
      padding-bottom: 8px;
    }
    .subtitle { color: #9ca3af; font-size: 0.85rem; margin-bottom: 16px; }
    .card {
      background: #16161a;
      border: 1px solid #2e2e36;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      background: #0d0d0f;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
    }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    button.stop { background: #3f3f46; margin-top: 8px; }
    .status-bar {
      font-size: 0.85rem;
      color: #f87171;
      margin-top: 10px;
      min-height: 20px;
    }
    .recruit-card {
      background: #16161a;
      border-left: 4px solid #dc2626;
      border-top: 1px solid #27272a;
      border-right: 1px solid #27272a;
      border-bottom: 1px solid #27272a;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .recruit-info h3 { margin: 0 0 4px 0; font-size: 1rem; color: #fff; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-right: 4px;
    }
    .online { background: #14532d; color: #4ade80; }
    .idle { background: #713f12; color: #facc15; }
    .offline { background: #27272a; color: #a1a1aa; }
    .meta { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }
    .actions { display: flex; flex-direction: column; gap: 6px; min-width: 105px; }
    .btn-link {
      text-align: center;
      text-decoration: none;
      background: #27272a;
      color: #fff;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid #3f3f46;
    }
    .btn-msg { background: #991b1b; border-color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sinister Sicks — Recruit Scouter</h1>
    <div class="subtitle">Finds active, factionless players (Levels 1–15) ranked by daily playtime & presence.</div>

    <div class="card">
      <label>Torn API Key (Public Key is enough)</label>
      <input type="password" id="apiKey" placeholder="Paste your 16-character Torn API key" />

      <div class="row">
        <div>
          <label>Start User ID (Newest ID)</label>
          <input type="number" id="startId" placeholder="e.g. 3450000" />
        </div>
        <div>
          <label>How Many IDs to Scan Backwards</label>
          <input type="number" id="scanCount" value="50" min="1" max="200" />
        </div>
      </div>

      <label>Or Paste Specific User IDs (comma or space separated — overrides range)</label>
      <textarea id="customIds" rows="2" placeholder="Optional: 3450112, 3450118, 3450125"></textarea>

      <label>Max Hours Since Last Action</label>
      <input type="number" id="maxHours" value="12" min="1" max="168" />

      <button id="startBtn" onclick="startScout()">Start Recruitment Scan</button>
      <button id="stopBtn" class="stop" onclick="stopScout()" style="display:none;">Stop Scan</button>
      <div class="status-bar" id="statusText">Ready.</div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    let scanning = false;
    let recruits = [];

    // Save API key locally in browser for convenience
    window.onload = () => {
      const savedKey = localStorage.getItem("sicks_recruit_api");
      if (savedKey) document.getElementById("apiKey").value = savedKey;
    };

    function stopScout() {
      scanning = false;
      document.getElementById("statusText").textContent = "Scan stopped.";
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").style.display = "none";
    }

    function calculateRecruitScore(profile, stats) {
      const now = Math.floor(Date.now() / 1000);
      const lastAction = profile.last_action?.timestamp || 0;
      const minsAgo = Math.max(1, Math.round((now - lastAction) / 60));

      // Active playtime in minutes (Torn tracks useractivity in seconds)
      const activitySec = stats?.useractivity || 0;
      const activityHours = activitySec / 3600;
      const ageDays = Math.max(1, profile.age || 1);

      // Hours played per day of account age (strongest indicator of a grinder)
      const hoursPerDay = activityHours / ageDays;

      // Presence bonus
      const status = (profile.last_action?.status || "").toLowerCase();
      let presenceBonus = 0;
      if (status === "online") presenceBonus = 50;
      else if (status === "idle") presenceBonus = 25;

      // Recency bonus (up to 40 pts if active in last hour)
      const recencyBonus = Math.max(0, 40 - (minsAgo / 15));

      const totalScore = (hoursPerDay * 25) + presenceBonus + recencyBonus;

      return {
        score: Math.round(totalScore),
        minsAgo,
        status: profile.last_action?.status || "Offline",
        hoursPerDay: hoursPerDay.toFixed(1),
        totalHours: activityHours.toFixed(1),
        ageDays
      };
    }

    function renderResults() {
      const container = document.getElementById("results");
      recruits.sort((a, b) => b.metrics.score - a.metrics.score);

      container.innerHTML = recruits.map(r => {
        const statusClass = r.metrics.status.toLowerCase() === "online"
          ? "online"
          : (r.metrics.status.toLowerCase() === "idle" ? "idle" : "offline");

        return `
          <div class="recruit-card">
            <div class="recruit-info">
              <h3>
                <span class="badge ${statusClass}">${r.metrics.status}</span>
                ${r.name} [${r.id}] — Lvl ${r.level}
              </h3>
              <div class="meta">
                Activity Score: <strong style="color:#f87171;">${r.metrics.score}</strong> •
                Avg Playtime: <strong>${r.metrics.hoursPerDay} hrs/day</strong> (${r.metrics.totalHours}h total in ${r.metrics.ageDays}d)
              </div>
              <div class="meta">
                Last Action: ${r.metrics.minsAgo} min(s) ago • Status: ${r.state}
              </div>
            </div>
            <div class="actions">
              <a class="btn-link" href="https://www.torn.com/profiles.php?XID=${r.id}" target="_blank">View Profile</a>
              <a class="btn-link btn-msg" href="https://www.torn.com/messages.php#/p=compose&XID=${r.id}" target="_blank">Send Message</a>
            </div>
          </div>
        `;
      }).join("");
    }

    async function startScout() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const startId = parseInt(document.getElementById("startId").value, 10);
      const scanCount = parseInt(document.getElementById("scanCount").value, 10) || 50;
      const customRaw = document.getElementById("customIds").value.trim();
      const maxHours = parseInt(document.getElementById("maxHours").value, 10) || 12;

      if (!apiKey) {
        alert("Please enter your Torn API key.");
        return;
      }
      localStorage.setItem("sicks_recruit_api", apiKey);

      let idsToCheck = [];
      if (customRaw) {
        idsToCheck = customRaw.split(/[\s,]+/).map(Number).filter(n => n > 0);
      } else if (startId > 0) {
        for (let i = 0; i < scanCount; i++) {
          if (startId - i > 0) idsToCheck.push(startId - i);
        }
      } else {
        alert("Enter a Starting User ID or paste specific IDs.");
        return;
      }

      scanning = true;
      recruits = [];
      document.getElementById("results").innerHTML = "";
      document.getElementById("startBtn").disabled = true;
      document.getElementById("stopBtn").style.display = "block";

      for (let i = 0; i < idsToCheck.length; i++) {
        if (!scanning) break;
        const id = idsToCheck[i];
        document.getElementById("statusText").textContent =
          `Checking ID ${id} (${i + 1}/${idsToCheck.length}) — Found ${recruits.length} active factionless recruits...`;

        try {
          const url = `https://api.torn.com/user/${id}?selections=profile,personalstats&key=${encodeURIComponent(apiKey)}`;
          const res = await fetch(url);
          const data = await res.json();

          if (data.error) {
            document.getElementById("statusText").textContent = `API Error: ${data.error.error}`;
            if (data.error.code === 5) {
              // Rate limit hit, pause 10 seconds
              await new Promise(r => setTimeout(r, 10000));
            }
            continue;
          }

          const level = Number(data.level);
          const factionId = data.faction?.faction_id || 0;
          const statusState = data.status?.state || "Okay";

          // Filter: Level 1-15, No Faction, Not in Federal Jail
          if (level >= 1 && level <= 15 && factionId === 0 && statusState !== "Federal") {
            const metrics = calculateRecruitScore(data, data.personalstats);
            if (metrics.minsAgo <= maxHours * 60) {
              recruits.push({
                id,
                name: data.name,
                level,
                state: statusState,
                metrics
              });
              renderResults();
            }
          }
        } catch (err) {
          console.warn(`Failed ID ${id}`, err);
        }

        // 700ms delay keeps rate at ~85 req/min (safely under Torn's 100 req/min limit)
        await new Promise(r => setTimeout(r, 700));
      }

      scanning = false;
      document.getElementById("statusText").textContent =
        `Scan complete. Found ${recruits.length} active factionless recruits (Levels 1–15).`;
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").style.display = "none";
    }
  </script>
</body>
</html>
